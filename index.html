<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Radar</title>
  <meta name="description" content="คลัง repo บน GitHub ที่เก็บไว้ ค้นได้ด้วยภาษาคน">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2313202B'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23F0A93B' stroke-width='1.5'/%3E%3Ccircle cx='21' cy='11' r='2.5' fill='%23F0A93B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1 class="brand">GitHub Radar</h1>
    <p class="count" id="count" aria-live="polite"></p>
  </header>

  <main>
    <section class="console" aria-label="ค้นหาและเรดาร์">
      <div class="controls">
        <label class="search">
          <span class="sr-only">ค้นหา repo</span>
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false"
                 placeholder="อันที่อ่านตัวหนังสือจากรูปได้, flutter, ล็อกอิน…">
          <kbd class="hint" aria-hidden="true">/</kbd>
        </label>

        <div class="tags" id="tags" role="group" aria-label="กรองตามแท็ก"></div>

        <div class="actions">
          <button class="dig" id="dig" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 14 10M14 10l-2-6 8 8-6-2Z"/></svg>
            สุ่มขุดของเก่า
          </button>
          <button class="ghost" id="clear" type="button" hidden>ล้างตัวกรอง</button>
        </div>

      </div>

      <figure class="radar-wrap">
        <svg id="radar" class="radar" viewBox="0 0 400 400" role="img" aria-label="เรดาร์ repo แบ่งตามหมวดและอายุที่เก็บ"></svg>
        <figcaption class="radar-legend" id="legend">
          มุมคือหมวด ยิ่งใกล้ศูนย์กลางยิ่งเพิ่งเก็บ จุดใหญ่คือดาวเยอะ
        </figcaption>
      </figure>
    </section>

    <section class="list" aria-label="รายการ repo">
      <div class="list-head">
        <h2 id="listTitle">ทั้งหมด</h2>
        <label class="sort" id="sortWrap">
          <span>เรียงตาม</span>
          <select id="sort">
            <option value="added">เก็บล่าสุด</option>
            <option value="stars">ดาวมากสุด</option>
            <option value="pushed">อัปเดตล่าสุด</option>
            <option value="name">ชื่อ A–Z</option>
          </select>
        </label>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        <p class="empty-title" id="emptyTitle"></p>
        <p class="empty-hint" id="emptyHint"></p>
      </div>
    </section>
  </main>

  <dialog id="detail" class="detail" aria-labelledby="dTitle">
    <form method="dialog" class="detail-close"><button aria-label="ปิด"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form>
    <div id="detailBody"></div>
  </dialog>

  <noscript><p class="noscript">หน้านี้ต้องเปิด JavaScript</p></noscript>
</body>
</html>
